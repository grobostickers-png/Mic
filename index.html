<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Live Mic (Media Override)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 420px;
      margin: 20px auto;
      padding: 16px;
      background: #121212;
      color: #f1f1f1;
      border-radius: 12px;
    }
    h2 { text-align: center; margin-bottom: 5px; color: #3b82f6; }
    p.subtitle { text-align: center; color: #a1a1aa; font-size: 14px; margin-bottom: 24px; }
    
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: 0.2s;
    }
    .btn-wake { background: #eab308; color: #000; }
    .btn-mic { background: #22c55e; color: #000; }
    .btn-mic.active { background: #ef4444; color: #fff; }
    
    .alert {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #fbbf24;
      margin-bottom: 20px;
      border-left: 4px solid #fbbf24;
    }
  </style>
</head>
<body>

  <h2>Web PA Override</h2>
  <p class="subtitle">Forced Bluetooth Media Routing</p>

  <div class="alert">
    <strong>Step 1:</strong> Tap "Wake Speaker" until you hear a beep from the Zeb-County. Do not skip this.<br><br>
    <strong>Step 2:</strong> Tap "Start Mic".
  </div>

  <button class="btn btn-wake" onclick="wakeSpeaker()">1. Wake Speaker (Force Media Mode)</button>
  <button id="toggleBtn" class="btn btn-mic" onclick="toggleMic()">2. Start Mic</button>

  <script>
    let audioCtx = null;
    let stream = null;
    let isRunning = false;

    // This function forces the OS to open the A2DP (High Quality Music) Bluetooth channel
    function wakeSpeaker() {
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = tempCtx.createOscillator();
      const gain = tempCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, tempCtx.currentTime); // A high beep
      gain.gain.setValueAtTime(0.1, tempCtx.currentTime);
      
      osc.connect(gain);
      gain.connect(tempCtx.destination);
      
      osc.start();
      osc.stop(tempCtx.currentTime + 0.3); // Play for 1/3 of a second
    }

    async function toggleMic() {
      const btn = document.getElementById('toggleBtn');

      if (!isRunning) {
        try {
          // Request mic access
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false, 
              autoGainControl: false,
              latency: 0
            }
          });

          // Initialize context
          audioCtx = new (window.AudioContext || window.webkitAudioContext)({
            latencyHint: "interactive",
            sampleRate: 44100
          });
          
          const source = audioCtx.createMediaStreamSource(stream);

          // Build audio chain: Mic -> Compressor (Safety Limiter) -> Output
          const compressor = audioCtx.createDynamicsCompressor();
          compressor.threshold.value = -24; 
          compressor.knee.value = 30;       
          compressor.ratio.value = 12;      
          compressor.attack.value = 0.003;  
          compressor.release.value = 0.25;  
          
          // Boost volume safely
          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 4.0; // 4x default boost

          source.connect(gainNode);
          gainNode.connect(compressor);
          compressor.connect(audioCtx.destination);

          btn.innerText = "Stop Mic";
          btn.classList.add('active');
          isRunning = true;
        } catch (err) {
          alert("Microphone denied or not supported.");
        }
      } else {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        btn.innerText = "2. Start Mic";
        btn.classList.remove('active');
        isRunning = false;
      }
    }
  </script>
</body>
</html>
