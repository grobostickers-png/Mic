<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Live Mic (Player Fix)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 420px;
      margin: 20px auto;
      padding: 16px;
      background: #121212;
      color: #f1f1f1;
      border-radius: 12px;
    }
    h2 { text-align: center; color: #3b82f6; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #22c55e;
      color: #000;
    }
    .btn.active {
      background: #ef4444;
      color: #fff;
    }
    .alert {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h2>Web PA (Media Route Fix)</h2>
  
  <div class="alert">
    This version routes your voice through a hidden web player to force Android to use the Bluetooth Media channel.
  </div>

  <button id="toggleBtn" class="btn" onclick="toggleMic()">Start Mic</button>
  
  <!-- This hidden audio player is the secret to tricking Android -->
  <audio id="liveOutput" autoplay playsinline style="display:none;"></audio>

  <script>
    let audioCtx = null;
    let stream = null;
    let isRunning = false;

    async function toggleMic() {
      const btn = document.getElementById('toggleBtn');
      const audioPlayer = document.getElementById('liveOutput');

      if (!isRunning) {
        try {
          // Get raw mic access
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, latency: 0 }
          });

          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaStreamSource(stream);

          // Volume Boost & Safety Compressor
          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 4.0;
          
          const compressor = audioCtx.createDynamicsCompressor();
          compressor.threshold.value = -24; 
          compressor.ratio.value = 12;      

          // THE HACK: Create a fake media destination instead of the raw device speaker
          const mediaDest = audioCtx.createMediaStreamDestination();

          source.connect(gainNode);
          gainNode.connect(compressor);
          compressor.connect(mediaDest);

          // Feed the processed audio into the hidden HTML5 audio element
          audioPlayer.srcObject = mediaDest.stream;
          await audioPlayer.play();

          btn.innerText = "Stop Mic";
          btn.classList.add('active');
          isRunning = true;
        } catch (err) {
          alert("Microphone error. Ensure permissions are granted.");
        }
      } else {
        if (stream) stream.getTracks().forEach(t => t.stop());
        if (audioCtx) audioCtx.close();
        audioPlayer.srcObject = null;
        
        btn.innerText = "Start Mic";
        btn.classList.remove('active');
        isRunning = false;
      }
    }
  </script>
</body>
</html>
